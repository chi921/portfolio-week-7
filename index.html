<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Personal homepage - showcase of profile and skills" />
  <title>My Profile</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Apply theme before paint to avoid flash
    (function () {
      var saved = localStorage.getItem("theme");
      var prefersDark = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;
      var theme =
        saved === "light" || saved === "dark"
          ? saved
          : prefersDark
          ? "dark"
          : "light";
      if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body>
  <!-- Background decorations -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <!-- Top navigation -->
  <header class="nav">
    <div class="nav-logo">MyProfile</div>
    <nav class="nav-links">
      <a href="index.html" class="nav-link active">Home</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="projects.html" class="nav-link">Projects</a>
      <a href="resume.html" class="nav-link">Resume</a>
      <a href="contact.html" class="nav-link">Contact Me</a>
    </nav>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" type="button">
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </header>

  <!-- Hero / Home -->
  <section class="hero">
    <div class="hero-content">
      <div class="avatar">
        <img src="avatar.jpg" alt="Yahan Yu" class="avatar-img" />
      </div>
      <h1 class="hero-title">Hi, I'm <span class="gradient-text">Yahan Yu</span></h1>
      <p class="hero-subtitle">Front-End Engineer · Design Enthusiast · Lifelong Learner</p>
      <div class="hero-cta">
        <a href="about.html" class="btn btn-primary">Learn More</a>
        <a href="contact.html" class="btn btn-ghost">Contact Me</a>
      </div>
    </div>
    <div class="scroll-hint">
      <span></span>
      Scroll Down
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2026 Yahan Yu. Crafted with care.</p>
  </footer>

  <script src="script.js?v=3"></script>
</body>
</html>
